name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que ficou desatualizada
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: ESLint (inclui a regra de camadas)
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: TypeScript
        run: npm run typecheck

      - name: Testes com cobertura
        run: npm run coverage

      - name: Build
        run: npm run build
