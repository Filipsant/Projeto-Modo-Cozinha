<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Encontre receitas, ajuste as porções e cozinhe passo a passo com o celular na bancada."
    />
    <meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12141A" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Modo Cozinha</title>
    <script>
      // Aplica o tema escolhido antes do CSS pintar a tela: quem usa o escuro não
      // vê um clarão branco ao abrir o app. Mesma chave do store do tema.
      try {
        var saved = JSON.parse(localStorage.getItem('modo-cozinha:theme') || 'null')
        var theme = saved && saved.state && saved.state.preference
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (error) {
        // Sem localStorage (modo privado antigo): segue o tema do sistema
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
